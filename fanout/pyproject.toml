[project]
name = "fanout"
version = "0.1.0"
description = "HTTP fanout service for forwarding requests to configured consumers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.0",
]

[project.scripts]
fanout = "fanout:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
